<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste OS</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1b3a;
color:white;
text-align:center;
}

/* NAV */
nav{
background:blue;
padding:10px;
}
nav a{
color:white;
text-decoration:none;
margin:10px;
font-weight:bold;
}

/* BUTTON */
button{
padding:8px;
border:none;
border-radius:6px;
background:#0071e3;
color:white;
cursor:pointer;
margin:4px;
}

/* CARD */
.card{
background:#1e3a8a;
padding:15px;
border-radius:10px;
max-width:700px;
margin:20px auto;
}

/* AVATAR AREA */
#stage{
display:flex;
justify-content:center;
gap:40px;
margin:20px;
align-items:center;
}

.character{
width:140px;
border-radius:50%;
transition:0.3s;
}

.speaking{
transform:scale(1.15);
box-shadow:0 0 25px cyan;
}

/* APP */
.app{
display:none;
margin-top:20px;
}

input, textarea{
padding:6px;
margin:4px;
border-radius:10px;
border:none;
}

textarea{
width:95%;
height:220px;
}
</style>
</head>

<body>

<!-- 🧠 AVATAR ORESTE -->
<div id="stage">
<img id="oreste" class="character"
src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png" alt="Oreste AI">

<img id="virus" class="character"
src="https://i.ibb.co/wHZ8KG6/logo.jpg" alt="System">
</div>

<h1>🖥️ Oreste OS</h1>

<div class="card">

<button onclick="app('calc')">🧮 Calcolatrice</button>
<button onclick="app('browser')">🌐 Browser</button>
<button onclick="app('antivirus')">🛡 Antivirus</button>
<button onclick="app('note')">📝 Blocco Note</button>

<!-- 📝 NOTE -->
<div id="note" class="app">
<h3>📝 Blocco Note</h3>

<textarea id="noteText"></textarea>

<br>

<button onclick="saveNote()">💾 Salva</button>
<button onclick="loadNote()">📂 Carica</button>
<button onclick="copyNote()">📋 Copia</button>
<button onclick="downloadNote()">📥 Scarica</button>
<button onclick="clearNote()">🗑 Cancella</button>

<p id="noteStatus"></p>
</div>

<!-- CALC -->
<div id="calc" class="app">
<h3>Calcolatrice</h3>

<input id="a" type="number">
<input id="b" type="number">

<br>

<button onclick="sum()">+</button>
<button onclick="sub()">-</button>
<button onclick="mul()">*</button>
<button onclick="div()">/</button>

<p id="res"></p>
</div>

<!-- BROWSER -->
<div id="browser" class="app">
<h3>Browser</h3>

<input id="url">
<button onclick="go()">Vai</button>
</div>

<!-- ANTIVIRUS -->
<div id="antivirus" class="app">
<h3>Antivirus</h3>

<button onclick="scan()">Scansiona</button>
<p id="status"></p>
</div>

</div>

<script>

/* 🎙 VOCE + AVATAR */
function speak(t){

const oreste = document.getElementById("oreste");
const virus = document.getElementById("virus");

let u = new SpeechSynthesisUtterance(t);
u.lang = "it-IT";

u.onstart = () => {
oreste.classList.add("speaking");
virus.classList.add("speaking");
};

u.onend = () => {
oreste.classList.remove("speaking");
virus.classList.remove("speaking");
};

speechSynthesis.cancel();
speechSynthesis.speak(u);
}

/* APP SWITCH */
function app(id){
document.querySelectorAll(".app").forEach(a => a.style.display = "none");
const el = document.getElementById(id);

if(el){
el.style.display = "block";
speak("Apro " + id);
}
}

/* CALCOLATRICE */
function sum(){ res.innerText = Number(a.value)+Number(b.value); }
function sub(){ res.innerText = Number(a.value)-Number(b.value); }
function mul(){ res.innerText = Number(a.value)*Number(b.value); }
function div(){
if(Number(b.value)==0){ res.innerText="Errore"; return; }
res.innerText = Number(a.value)/Number(b.value);
}

/* BROWSER */
function go(){
let u = url.value;
if(!u.startsWith("http")) u="https://"+u;
window.open(u,"_blank");
}

/* ANTIVIRUS */
function scan(){
status.innerText="Scansione...";
setTimeout(()=>{
let r=Math.random()>0.5?"Virus rilevato":"Sistema pulito";
status.innerText=r;
speak(r);
},1200);
}

/* NOTE */
function saveNote(){
localStorage.setItem("oreste_note", noteText.value);
noteStatus.innerText="💾 Documento salvato";
speak("Documento salvato");
}

function loadNote(){
noteText.value = localStorage.getItem("oreste_note") || "";
noteStatus.innerText="📂 Documento caricato";
speak("Documento caricato");
}

function clearNote(){
localStorage.removeItem("oreste_note");
noteText.value="";
noteStatus.innerText="🗑 Documento eliminato";
speak("Documento eliminato");
}

function copyNote(){
navigator.clipboard.writeText(noteText.value);
noteStatus.innerText="📋 Documento copiato";
speak("Documento copiato");
}

function downloadNote(){
const blob = new Blob([noteText.value],{type:"text/plain"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="note-oreste.txt";
a.click();
speak("Download effettuato");
}

/* START */
window.onload=()=>{
speak("Benvenuto in Oreste OS");
};

</script>

</body>
