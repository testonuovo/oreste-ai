name: Build Oreste AI Cleaner

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-cleaner:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Oreste AI Cleaner
        shell: cmd
        run: |
          python -m PyInstaller --onefile --noconsole oreste_cleaner.py
          if not exist "oreste ai cleaner\dist" mkdir "oreste ai cleaner\dist"
          copy /Y "dist\oreste_cleaner.exe" "oreste ai cleaner\dist\OresteAICleaner.exe"

      - name: Build installer
        shell: cmd
        run: |
          ISCC.exe "oreste ai cleaner\installer.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OresteAICleanerSetup
          path: "oreste ai cleaner\installer\OresteAICleanerSetup.exe"
          if-no-files-found: error
