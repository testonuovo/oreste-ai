<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste AI</title>

<style>
body{
    font-family: Arial;
    background:#0a3d91;
    color:white;
    text-align:center;
    margin:0;
}

h1{ margin-top:20px; }

nav{
    background: rgba(0,0,0,0.4);
    padding: 12px;
    margin: 10px;
    border-radius: 10px;
}

nav a{
    color:white;
    margin:5px;
    text-decoration:none;
}

#chat{
    width:90%;
    max-width:600px;
    margin:20px auto;
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:10px;
    min-height:200px;
    text-align:left;
}

input{
    width:70%;
    padding:10px;
    border-radius:10px;
    border:none;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    cursor:pointer;
}

button:hover{ background:darkred; }

.msg{ margin:8px 0; padding:8px; }
</style>
</head>

<body>

<h1>🎤 Oreste AI</h1>

<nav>
<a href="index.html">🏠 Home</a>
<a href="assistente-vocale.html">🎤 Assistente</a>
<a href="chat.html">💬 Chat</a>
<a href="download.html">📥 Download</a>
</nav>

<h2>Assistente vocale</h2>

<input id="input" placeholder="Scrivi o parla...">
<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<div id="chat"></div>

<script>

/* ================= CHAT ================= */
function add(t,m){
    document.getElementById("chat").innerHTML +=
    "<div class='msg'>"+t+": "+m+"</div>";
}

function speak(t){
    let s = new SpeechSynthesisUtterance(t);
    s.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(s);
}

/* ================= SITI ================= */
function apriSito(text){

    text = text.toLowerCase();

    const siti = [
        {k:["google"], url:"https://google.com", nome:"Google"},
        {k:["youtube"], url:"https://youtube.com", nome:"YouTube"},
        {k:["facebook"], url:"https://facebook.com", nome:"Facebook"},
        {k:["instagram"], url:"https://instagram.com", nome:"Instagram"},
        {k:["tiktok"], url:"https://tiktok.com", nome:"TikTok"},
        {k:["canva"], url:"https://canva.com", nome:"Canva"},
        {k:["whatsapp"], url:"https://web.whatsapp.com", nome:"WhatsApp"},
        {k:["github"], url:"https://github.com", nome:"GitHub"},
        {k:["pinterest"], url:"https://pinterest.com", nome:"Pinterest"},
        {k:["linkedin"], url:"https://linkedin.com", nome:"LinkedIn"}
    ];

    for(let s of siti){
        for(let x of s.k){
            if(text.includes(x)){
                window.open(s.url,"_blank");
                return "Apro " + s.nome;
            }
        }
    }
    return null;
}

/* ================= METEO ================= */
async function meteo(citta){

    try{
        let g = await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+citta);
        let geo = await g.json();

        if(!geo.results) return "Città non trovata";

        let lat = geo.results[0].latitude;
        let lon = geo.results[0].longitude;

        let w = await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current_weather=true");
        let data = await w.json();

        return "🌤️ " + geo.results[0].name + ": " + data.current_weather.temperature + "°C";
    }catch(e){
        return "Errore meteo";
    }
}

/* ================= TIMER ================= */
let timerInterval = null;

function timer(sec){

    sec = parseInt(sec);
    if(isNaN(sec)) return "Scrivi: timer 10";

    if(timerInterval) clearInterval(timerInterval);

    let t = sec;

    timerInterval = setInterval(()=>{

        add("⏱️", t + " sec");

        t--;

        if(t < 0){
            clearInterval(timerInterval);
            timerInterval = null;
            speak("Timer terminato");
            add("⏱️","FINE!");
        }

    },1000);

    return "Timer avviato per " + sec + " secondi";
}

/* ================= SVEGLIA ================= */
let svegliaTimer = null;

function sveglia(orario){

    let [h,m] = orario.split(":").map(Number);
    let now = new Date();
    let s = new Date();
    s.setHours(h,m,0);

    let diff = s - now;

    if(diff < 0) return "Orario passato";

    if(svegliaTimer) clearTimeout(svegliaTimer);

    svegliaTimer = setTimeout(()=>{
        add("⏰","SVEGLIA!");
        speak("Sveglia!");
        alert("SVEGLIA!");
    }, diff);

    return "Sveglia impostata per " + orario;
}

/* ================= DOWNLOAD PROGRAMMI ================= */
function scaricaProgramma(nome){
    window.open(
        "https://www.google.com/search?q=download+" + encodeURIComponent(nome),
        "_blank"
    );
    return "Cerco il download di " + nome;
}

/* ================= AI ================= */
async function handle(text){

    text = text.toLowerCase();

    let sito = apriSito(text);
    if(sito) return sito;

    if(text.includes("ciao")) return "Ciao!";
    if(text.includes("ora")) return new Date().toLocaleTimeString();
    if(text.includes("data")) return new Date().toLocaleDateString();

    if(text.startsWith("meteo")){
        let c = text.replace("meteo","").trim();
        return await meteo(c);
    }

    if(text.startsWith("timer")){
        return timer(text.replace("timer","").trim());
    }

    if(text.startsWith("sveglia")){
        return sveglia(text.replace("sveglia","").trim());
    }

    if(text.startsWith("cerca")){
        let q = text.replace("cerca","").trim();
        window.open("https://google.com/search?q="+q,"_blank");
        return "Cerco " + q;
    }

    if(text.startsWith("scarica")){
        let app = text.replace("scarica","").trim();
        return scaricaProgramma(app);
    }

    return "Non ho capito";
}

/* ================= INPUT ================= */
function ask(){
    let i = document.getElementById("input");
    let t = i.value;
    if(!t) return;

    add("🧑",t);
    let r = handle(t);
    add("🤖",r);
    speak(r);

    i.value="";
}

/* ================= VOCE ================= */
function voice(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return alert("Non supportato");

    let r = new SR();
    r.lang="it-IT";

    r.onresult = e=>{
        let t = e.results[0][0].transcript;
        add("🧑",t);
        let r2 = handle(t);
        add("🤖",r2);
        speak(r2);
    };

    r.start();
}

</script>

</body>
</html>
