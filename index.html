<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste AI</title>

<style>
body{
    font-family: Arial;
    background:#0a3d91;
    color:white;
    text-align:center;
    margin:0;
}

nav a{
    color:white;
    margin:5px;
    text-decoration:none;
}

#chat{
    width:90%;
    max-width:600px;
    margin:20px auto;
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:10px;
    min-height:200px;
    text-align:left;
}

input{
    width:70%;
    padding:10px;
    border-radius:10px;
}

button{
    padding:10px;
    margin:5px;
    background:red;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🎤 Oreste AI</h1>

<input id="input" placeholder="Scrivi o parla...">
<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<div id="chat"></div>

<script>

/* CHAT */
function add(t,m){
    document.getElementById("chat").innerHTML += `<div>${t}: ${m}</div>`;
}

function speak(t){
    let s = new SpeechSynthesisUtterance(t);
    s.lang = "it-IT";
    speechSynthesis.speak(s);
}

/* APERTURA SITI */
function openSite(text){

    text = text.toLowerCase();

    const sites = [
        {k:["google"], url:"https://google.com", name:"Google"},
        {k:["youtube"], url:"https://youtube.com", name:"YouTube"},
        {k:["facebook"], url:"https://facebook.com", name:"Facebook"},
        {k:["instagram"], url:"https://instagram.com", name:"Instagram"},
        {k:["pinterest"], url:"https://pinterest.com", name:"Pinterest"},
        {k:["linkedin"], url:"https://linkedin.com", name:"LinkedIn"},
        {k:["github"], url:"https://github.com", name:"GitHub"}
    ];

    for(let s of sites){
        for(let key of s.k){
            if(text.includes(key)){
                window.open(s.url,"_blank");
                return "Apro " + s.name;
            }
        }
    }

    return null;
}

/* WINDOWS UPDATE SIMULATO */
function windowsUpdate(){
    window.open("https://www.microsoft.com/software-download/windows10","_blank");
    return "Apro aggiornamenti Windows ufficiali";
}

/* HANDLE PRINCIPALE */
async function handle(text){

    text = text.toLowerCase();

    /* siti */
    let site = openSite(text);
    if(site) return site;

    if(text.includes("windows update") || text.includes("aggiorna windows")){
        return windowsUpdate();
    }

    if(text.startsWith("cerca")){
        let q = text.replace("cerca","").trim();
        window.open("https://google.com/search?q="+q,"_blank");
        return "Cerco " + q;
    }

    if(text.includes("ora")){
        return new Date().toLocaleTimeString();
    }

    if(text.includes("data")){
        return new Date().toLocaleDateString();
    }

    return "Non ho capito";
}

/* INPUT */
async function ask(){
    let i = document.getElementById("input");
    let t = i.value;
    if(!t) return;

    add("🧑",t);

    let r = await handle(t);

    add("🤖",r);
    speak(r);

    i.value="";
}

/* VOCE */
function voice(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return alert("Non supportato");

    let r = new SR();
    r.lang = "it-IT";

    r.onresult = async e => {
        let t = e.results[0][0].transcript;

        add("🧑",t);

        let r2 = await handle(t);

        add("🤖",r2);
        speak(r2);
    };

    r.start();
}

</script>

</body>
</html>
