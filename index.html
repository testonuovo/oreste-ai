<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste AI</title>

<style>
body{
    font-family: Arial;
    background:#0a3d91;
    color:white;
    text-align:center;
    margin:0;
}

nav a{ color:white; margin:5px; text-decoration:none; }

#chat{
    width:90%;
    max-width:600px;
    margin:20px auto;
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:10px;
    min-height:200px;
    text-align:left;
}

input,button{
    padding:10px;
    margin:5px;
}
button{
    background:red;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🎤 Oreste AI</h1>

<nav>
<a href="index.html">🏠 Home</a>

<input id="input" placeholder="Scrivi o parla...">
<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<div id="chat"></div>

<script>

/* CHAT */
function add(w,t){
    document.getElementById("chat").innerHTML += `<div><b>${w}:</b> ${t}</div>`;
}

function speak(t){
    let s = new SpeechSynthesisUtterance(t);
    s.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(s);
}

/* SITI */
function openSite(t){
    t = t.toLowerCase();

    const s = {
        google:"https://google.com",
        youtube:"https://youtube.com",
        facebook:"https://facebook.com",
        instagram:"https://instagram.com"
    };

    for(let k in s){
        if(t.includes(k)){
            window.open(s[k],"_blank");
            return "Apro " + k;
        }
    }
    return null;
}

/* METEO (SICURO) */
async function meteo(city){
    try{
        let g = await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+city);
        let j = await g.json();

        if(!j.results) return "Città non trovata";

        let lat = j.results[0].latitude;
        let lon = j.results[0].longitude;

        let w = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude="+lat+
            "&longitude="+lon+"&current_weather=true"
        );

        let d = await w.json();

        return "🌤️ " + j.results[0].name + ": " + d.current_weather.temperature + "°C";

    } catch(e){
        return "Errore meteo";
    }
}

/* TIMER */
let timer = null;

function startTimer(sec){

    sec = parseInt(sec);
    if(isNaN(sec)) return "Scrivi: timer 10";

    let t = sec;

    if(timer) clearInterval(timer);

    timer = setInterval(()=>{

        add("⏱️", t + " sec");

        t--;

        if(t < 0){
            clearInterval(timer);
            timer = null;
            speak("Timer finito");
            add("⏱️","FINITO");
        }

    },1000);

    return "Timer avviato";
}

/* AI */
async function handle(text){

    text = text.toLowerCase();

    let site = openSite(text);
    if(site) return site;

    if(text.includes("ciao")) return "Ciao!";
    if(text.includes("ora")) return new Date().toLocaleTimeString();
    if(text.includes("data")) return new Date().toLocaleDateString();

    if(text.startsWith("meteo")){
        return await meteo(text.replace("meteo","").trim());
    }

    if(text.startsWith("timer")){
        return startTimer(text.replace("timer","").trim());
    }

    return "Non ho capito";
}

/* INPUT */
async function ask(){
    let i = document.getElementById("input");
    let t = i.value;
    if(!t) return;

    add("🧑",t);

    let r = await handle(t);

    add("🤖",r);
    speak(r);

    i.value="";
}

/* VOCE */
function voice(){
    let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return alert("Non supportato");

    let r = new SR();
    r.lang = "it-IT";

    r.onresult = async e=>{
        let t = e.results[0][0].transcript;

        add("🧑",t);

        let r2 = await handle(t);

        add("🤖",r2);
        speak(r2);
    };

    r.start();
}

</script>

</body>
</html>
