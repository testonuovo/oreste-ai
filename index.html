<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste AI</title>

<style>
body{
    font-family: Arial;
    background:#0a3d91;
    color:white;
    text-align:center;
    margin:0;
}

h1{ margin-top:20px; }

nav{
    background:rgba(0,0,0,0.4);
    padding:10px;
    margin:10px;
    border-radius:10px;
}

nav a{
    color:white;
    margin:6px;
    text-decoration:none;
}

#chat{
    width:90%;
    max-width:600px;
    margin:20px auto;
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:10px;
    min-height:200px;
    text-align:left;
}

input{
    width:70%;
    padding:10px;
    border-radius:10px;
    border:none;
}

button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    cursor:pointer;
}

button:hover{ background:darkred; }

.msg{ margin:6px 0; }

#calendar{
    width:90%;
    max-width:600px;
    margin:20px auto;
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:5px;
}

.day{
    background:rgba(255,255,255,0.1);
    padding:8px;
    border-radius:8px;
}
</style>
</head>

<body>

<h1>🎤 Oreste AI</h1>

<!-- MENU -->
<nav>
<a href="#">Home</a>
<a href="#">Chat</a>
<a href="#">Assistente</a>
<a href="#">Download</a>
</nav>

<input id="input" placeholder="Scrivi o parla...">
<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤</button>

<div id="chat"></div>

<h2>📅 Calendario</h2>
<div id="calendar"></div>

<script>

/* ================= CHAT ================= */
function add(who,text){
    document.getElementById("chat").innerHTML +=
    `<div class="msg"><b>${who}:</b> ${text}</div>`;
}

function speak(text){
    let s = new SpeechSynthesisUtterance(text);
    s.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(s);
}

/* ================= SITI ================= */
function openSite(text){

    text = text.toLowerCase();

    const sites = {
        google:"https://google.com",
        youtube:"https://youtube.com",
        facebook:"https://facebook.com",
        instagram:"https://instagram.com",
        github:"https://github.com",
        canva:"https://canva.com",
        pinterest:"https://pinterest.com",
        linkedin:"https://linkedin.com"
    };

    for(let k in sites){
        if(text.includes(k)){
            window.open(sites[k],"_blank");
            return "Apro " + k;
        }
    }

    return null;
}

/* ================= METEO ================= */
async function meteo(city){

    try{
        let g = await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+city);
        let geo = await g.json();

        if(!geo.results) return "Città non trovata";

        let lat = geo.results[0].latitude;
        let lon = geo.results[0].longitude;

        let w = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude="+lat+
            "&longitude="+lon+"&current_weather=true"
        );

        let data = await w.json();

        return "🌤️ " + geo.results[0].name + ": " +
               data.current_weather.temperature + "°C";

    }catch(e){
        return "Errore meteo";
    }
}

/* ================= TIMER ================= */
let timer = null;

function startTimer(sec){

    sec = parseInt(sec);
    if(isNaN(sec)) return "Scrivi: timer 10";

    let t = sec;

    if(timer) clearInterval(timer);

    timer = setInterval(()=>{

        add("⏱️", t + " sec");

        t--;

        if(t < 0){
            clearInterval(timer);
            timer = null;
            add("⏱️","FINITO!");
            speak("Timer terminato");
        }

    },1000);

    return "Timer avviato";
}

/* ================= SVEGLIA ================= */
function sveglia(time){

    let [h,m] = time.split(":").map(Number);

    let now = new Date();
    let s = new Date();
    s.setHours(h,m,0);

    let diff = s - now;

    if(diff < 0) return "Orario passato";

    setTimeout(()=>{
        add("⏰","SVEGLIA!");
        speak("Sveglia!");
    },diff);

    return "Sveglia impostata";
}

/* ================= DOWNLOAD ================= */
function scarica(app){

    window.open(
        "https://www.google.com/search?q=download+"+encodeURIComponent(app),
        "_blank"
    );

    return "Cerco download di " + app;
}

/* ================= AI ================= */
async function handle(text){

    text = text.toLowerCase();

    let site = openSite(text);
    if(site) return site;

    if(text.includes("ciao")) return "Ciao!";
    if(text.includes("ora")) return new Date().toLocaleTimeString();
    if(text.includes("data")) return new Date().toLocaleDateString();

    if(text.startsWith("meteo")){
        return await meteo(text.replace("meteo","").trim());
    }

    if(text.startsWith("timer")){
        return startTimer(text.replace("timer","").trim());
    }

    if(text.startsWith("sveglia")){
        return sveglia(text.replace("sveglia","").trim());
    }

    if(text.startsWith("scarica")){
        return scarica(text.replace("scarica","").trim());
    }

    if(text.startsWith("cerca")){
        let q = text.replace("cerca","").trim();
        window.open("https://google.com/search?q="+q,"_blank");
        return "Cerco " + q;
    }

    return "Non ho capito";
}

/* ================= INPUT ================= */
async function ask(){

    let i = document.getElementById("input");
    let t = i.value;
    if(!t) return;

    add("🧑",t);

    let r = await handle(t);

    add("🤖",r);
    speak(r);

    i.value="";
}

/* ================= VOCE ================= */
function voice(){

    let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return alert("Non supportato");

    let r = new SR();
    r.lang = "it-IT";

    r.onresult = async e=>{
        let t = e.results[0][0].transcript;

        add("🧑",t);

        let r2 = await handle(t);

        add("🤖",r2);
        speak(r2);
    };

    r.start();
}

</script>

</body>
</html>
