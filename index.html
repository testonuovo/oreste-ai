<script>
function add(nome,testo){

let chat=document.getElementById("chat");

chat.innerHTML +=
"<div class='msg'><b>"+nome+":</b> "+testo+"</div>";

chat.scrollTop=chat.scrollHeight;

}



function speak(testo){

if(!("speechSynthesis" in window)) return;

let voce=new SpeechSynthesisUtterance(testo);

voce.lang="it-IT";

speechSynthesis.cancel();

speechSynthesis.speak(voce);

}




/* ================= SITI ================= */


function openSite(testo){

let siti={

"google":"https://google.com",
"youtube":"https://youtube.com",
"facebook":"https://facebook.com",
"instagram":"https://instagram.com",
"tiktok":"https://tiktok.com",
"github":"https://github.com"

};


for(let nome in siti){

if(testo.includes(nome)){

window.open(siti[nome],"_blank");

return "Apro "+nome;

}

}


return null;

}





/* ================= METEO ================= */


async function meteo(citta){


try{


let r=await fetch(
"https://geocoding-api.open-meteo.com/v1/search?name="
+encodeURIComponent(citta)
);


let dati=await r.json();


if(!dati.results){

return "Città non trovata";

}



let lat=dati.results[0].latitude;

let lon=dati.results[0].longitude;



let w=await fetch(

"https://api.open-meteo.com/v1/forecast?latitude="
+lat+
"&longitude="
+lon+
"&current_weather=true"

);



let tempo=await w.json();


return "🌤️ "+dati.results[0].name+
": "+tempo.current_weather.temperature+" gradi";


}

catch(e){

return "Errore meteo";

}


}






/* ================= TIMER ================= */


let timer=null;


function startTimer(secondi){


secondi=parseInt(secondi);


if(isNaN(secondi)){

return "Scrivi timer seguito dai secondi";

}



if(timer){

clearInterval(timer);

}



let tempo=secondi;



timer=setInterval(()=>{


add("⏱️",tempo+" secondi");


tempo--;



if(tempo<0){


clearInterval(timer);

timer=null;


add("⏱️","FINITO");

speak("Timer terminato");


}


},1000);



return "Timer avviato per "+secondi+" secondi";


}






/* ================= SVEGLIA ================= */


let svegliaTimer=null;



function sveglia(orario){


let parti=orario.split(":");



if(parti.length!==2){

return "Scrivi sveglia nel formato ore:minuti";

}



let h=parseInt(parti[0]);

let m=parseInt(parti[1]);



let adesso=new Date();

let obiettivo=new Date();



obiettivo.setHours(h);

obiettivo.setMinutes(m);

obiettivo.setSeconds(0);



let differenza=obiettivo-adesso;



if(differenza<0){

return "Orario già passato";

}



if(svegliaTimer){

clearTimeout(svegliaTimer);

}



svegliaTimer=setTimeout(()=>{


add("⏰","SVEGLIA!");

speak("Sveglia!");

alert("SVEGLIA!");



},differenza);



return "Sveglia impostata alle "+orario;


}






/* ================= DOWNLOAD ================= */


function scaricaProgramma(nome){


if(!nome){

return "Dimmi quale programma vuoi scaricare";

}



window.open(

"https://www.google.com/search?q=download+"
+encodeURIComponent(nome),

"_blank"

);



return "Cerco il download di "+nome;


}







/* ================= CERVELLO ORESTE AI ================= */


async function handle(text){


text=text.toLowerCase().trim();




let sito=openSite(text);


if(sito){

return sito;

}





if(text.includes("ciao")){

return "Ciao! Sono Oreste AI";

}





if(text.includes("aiuto") ||
text.includes("cosa sai fare")){


return "Sono Oreste AI. Posso aiutarti con meteo, timer, sveglia, ricerca, download, siti, musica e comandi vocali.";

}





if(text.includes("ora")){

return "Sono le "+new Date().toLocaleTimeString();

}




if(text.includes("data")){

return "Oggi è il "+new Date().toLocaleDateString();

}






if(text.startsWith("meteo")){


let citta=text.replace("meteo","").trim();


return await meteo(citta);


}





if(text.startsWith("timer")){


return startTimer(
text.replace("timer","").trim()
);


}





if(text.startsWith("sveglia")){


return sveglia(
text.replace("sveglia","").trim()
);


}





if(text.startsWith("cerca")){


let ricerca=text.replace("cerca","").trim();


window.open(

"https://www.google.com/search?q="
+encodeURIComponent(ricerca),

"_blank"

);



return "Cerco "+ricerca;


}





if(text.startsWith("scarica")){


return scaricaProgramma(

text.replace("scarica","").trim()

);


}





if(text.includes("vicino contursi")){


window.open(
"https://youtu.be/r5gGcrJJn_0",
"_blank"
);

return "vicino contursi";


}





if(text.includes("difesa personale")){


window.open(
"https://youtu.be/uUUilRrSrLA",
"_blank"
);


return "difesa personale";


}





if(text.includes("amnesty international")){


window.open(
"https://www.amnesty.it/",
"_blank"
);


return "amnesty international";


}

let risultatoCantante = cantante(text);

if(risultatoCantante){

return risultatoCantante;

}


return "Non ho capito. Scrivi aiuto per vedere i comandi.";

}
function cantante(nome){

nome = nome.toLowerCase().trim();

let artisti = {

"max pezzali":"https://www.youtube.com/results?search_query=Max+Pezzali",
"883":"https://www.youtube.com/results?search_query=883+Max+Pezzali",
"vasco rossi":"https://www.youtube.com/results?search_query=Vasco+Rossi",
"ligabue":"https://www.youtube.com/results?search_query=Ligabue",
"liga":"https://www.youtube.com/results?search_query=Ligabue",
"tiziano ferro":"https://www.youtube.com/results?search_query=Tiziano+Ferro",
"laura pausini":"https://www.youtube.com/results?search_query=Laura+Pausini",
"eros ramazzotti":"https://www.youtube.com/results?search_query=Eros+Ramazzotti",
"ramazzotti":"https://www.youtube.com/results?search_query=Eros+Ramazzotti",
"maneskin":"https://www.youtube.com/results?search_query=Maneskin",
"alessandra amoroso":"https://www.youtube.com/results?search_query=Alessandra+Amoroso"

};


for(let artista in artisti){

if(
nome.includes(artista) ||
nome.includes("cantante "+artista) ||
nome.includes("ascolta "+artista) ||
nome.includes("metti "+artista)
){

window.open(
artisti[artista],
"_blank"
);

return "🎤 Apro le canzoni di " + artista;
}

}


return null;

}







/* ================= AGGIUNTA CANTANTI AL CERVELLO ================= */


let vecchioHandle=handle;


handle=async function(text){


let risultatoCantante=cantante(text.toLowerCase());


if(risultatoCantante){

return risultatoCantante;

}


return await vecchioHandle(text);


}






/* ================= INVIO ================= */


async function ask(){


let campo=document.getElementById("input");


let testo=campo.value.trim();



if(!testo){

return;

}



add("🧑",testo);



let risposta=await handle(testo);



add("🤖",risposta);



if(risposta && risposta.trim() !== ""){
    speak(risposta);
}



campo.value="";


}








/* ================= VOCE ================= */


function voice(){



let SpeechRecognition=

window.SpeechRecognition ||

window.webkitSpeechRecognition;



if(!SpeechRecognition){


alert(
"Il riconoscimento vocale funziona meglio con Google Chrome"
);


return;


}




let ascolto=new SpeechRecognition();



ascolto.lang="it-IT";

ascolto.continuous=false;

ascolto.interimResults=false;




ascolto.onstart=function(){

add("🎤","Ascolto attivo...");

};




ascolto.onresult=async function(event){


let testo=event.results[0][0].transcript;



add("🧑",testo);



let risposta=await handle(testo);



add("🤖",risposta);

if(risposta!=""){
speak(risposta);
}


};





ascolto.onerror=function(){

add("🎤","Errore riconoscimento vocale");

};




ascolto.start();


}



</script>
