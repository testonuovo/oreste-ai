<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oreste AI</title>

<style>
body{
    font-family: Arial;
    background:#0a3d91;
    color:white;
    text-align:center;
    margin:0;
}

h1{ margin-top:20px; }

nav{
    background: rgba(0,0,0,0.4);
    padding: 12px;
    border-radius: 10px;
    margin: 10px;
}

nav a{
    color:white;
    margin:5px;
    text-decoration:none;
}

#chat{
    width:90%;
    max-width:600px;
    margin:20px auto;
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:10px;
    min-height:300px;
    text-align:left;
}

input{
    width:70%;
    padding:10px;
    border-radius:10px;
    border:none;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    cursor:pointer;
}

button:hover{ background:darkred; }

.msg{
    margin:8px 0;
    padding:8px;
}

#calendar{
    width:90%;
    max-width:600px;
    margin:20px auto;
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:5px;
}

.day{
    background: rgba(255,255,255,0.1);
    padding:10px;
    border-radius:8px;
    cursor:pointer;
}

.empty{ background:transparent; }

</style>
</head>

<body>

<h1>🎤 Oreste AI</h1>

<!-- MENU (OK NON TOCCATO) -->
<nav>
<a href="index.html">🏠 Home</a>
<a href="assistente-vocale.html">🎤 Assistente</a>

<a href="dashboard.html">📊 Dashboard</a>
<a href="os.html">🖥️ Oreste OS</a>
</nav>

<h2>Assistente vocale</h2>

<input id="input" placeholder="Scrivi o parla...">
<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<div id="chat"></div>

<h2>📅 Calendario</h2>

<div>
<button onclick="prevMonth()">⬅️</button>
<span id="monthTitle"></span>
<button onclick="nextMonth()">➡️</button>
</div>

<div id="calendar"></div>

<script>

/* ===== CHAT ===== */
function add(t,m){
    document.getElementById("chat").innerHTML +=
    `<div class='msg'>${t}: ${m}</div>`;
}

function speak(t){
    let s = new SpeechSynthesisUtterance(t);
    s.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(s);
}

/* ===== CALENDARIO ===== */
let date = new Date();
const mesi = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];

function render(){
    let cal = document.getElementById("calendar");
    cal.innerHTML = "";

    let y = date.getFullYear();
    let m = date.getMonth();

    document.getElementById("monthTitle").innerText = mesi[m] + " " + y;

    let first = new Date(y,m,1).getDay();
    let days = new Date(y,m+1,0).getDate();

    for(let i=0;i<first;i++){
        cal.innerHTML += `<div class='day empty'></div>`;
    }

    for(let d=1;d<=days;d++){
        cal.innerHTML += `<div class='day' onclick="alert('Evento giorno ${d}')">${d}</div>`;
    }
}
render();

/* ===== SITI ===== */
function apriSito(text){
    text = text.toLowerCase();

    const siti = [
        {k:["google"], url:"https://google.com", nome:"Google"},
        {k:["youtube"], url:"https://youtube.com", nome:"YouTube"},
        {k:["facebook"], url:"https://facebook.com", nome:"Facebook"},
        {k:["instagram"], url:"https://instagram.com", nome:"Instagram"},
        {k:["tiktok"], url:"https://tiktok.com", nome:"TikTok"},
        {k:["canva"], url:"https://canva.com", nome:"Canva"},
        {k:["whatsapp"], url:"https://web.whatsapp.com", nome:"WhatsApp"},
        {k:["github"], url:"https://github.com", nome:"GitHub"},
        {k:["pinterest"], url:"https://pinterest.com", nome:"Pinterest"},
        {k:["linkedin"], url:"https://linkedin.com", nome:"LinkedIn"}
    ];

    for(let s of siti){
        for(let x of s.k){
            if(text.includes(x)){
                window.open(s.url,"_blank");
                return "Apro " + s.nome;
            }
        }
    }
    return null;
}

/* ===== AI ===== */
function handle(text){

    text = text.toLowerCase();

    // siti prima
    let sito = apriSito(text);
    if(sito) return sito;

    if(text.includes("ciao")) return "Ciao!";
    if(text.includes("ora")) return new Date().toLocaleTimeString();
    if(text.includes("data")) return new Date().toLocaleDateString();

    if(text.startsWith("cerca")){
        let q = text.replace("cerca","").trim();
        window.open("https://google.com/search?q="+q,"_blank");
        return "Cerco " + q;
    }

    if(text.startsWith("timer")){
        let sec = parseInt(text.replace("timer",""));
        if(isNaN(sec)) return "Scrivi timer 10";

        let t = sec;

        let inter = setInterval(()=>{
            add("⏱️", t + " sec");
            t--;

            if(t < 0){
                clearInterval(inter);
                speak("Timer finito");
            }
        },1000);

        return "Timer avviato";
    }

    return "Non ho capito";
}

/* ===== INPUT ===== */
function ask(){
    let i = document.getElementById("input");
    let t = i.value;
    if(!t) return;

    add("🧑",t);
    let r = handle(t);
    add("🤖",r);
    speak(r);
    i.value="";
}

/* ===== VOCE ===== */
function voice(){
    let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return alert("Non supportato");

    let r = new SR();
    r.lang = "it-IT";

    r.onresult = e=>{
        let t = e.results[0][0].transcript;
        add("🧑",t);
        let r2 = handle(t);
        add("🤖",r2);
        speak(r2);
    };

    r.start();
}

</script>

</body>
</html>
