<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste AI</title>

<style>
body{
    font-family: Arial;
    background:#0a3d91;
    color:white;
    text-align:center;
    margin:0;
}

nav{
    background:rgba(0,0,0,0.4);
    padding:10px;
    margin:10px;
    border-radius:10px;
}

nav a{
    color:white;
    margin:6px;
    text-decoration:none;
}

#chat{
    width:90%;
    max-width:600px;
    margin:20px auto;
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:10px;
    min-height:200px;
    text-align:left;
}

input{
    width:70%;
    padding:10px;
    border-radius:10px;
    border:none;
}

button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    cursor:pointer;
}

button:hover{ background:darkred; }

.msg{ margin:6px 0; }
</style>
</head>

<body>

<h1>🎤 Oreste AI</h1>

<nav>
<a href="#">Home</a>
<a href="#">Assistente</a>
<a href="#">Chat</a>
</nav>

<input id="input" placeholder="Scrivi comando...">
<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤</button>

<div id="chat"></div>

<script>

/* ================= CHAT ================= */
function add(who,text){
    document.getElementById("chat").innerHTML +=
    `<div class="msg"><b>${who}:</b> ${text}</div>`;
}

function speak(text){
    let s = new SpeechSynthesisUtterance(text);
    s.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(s);
}

/* ================= SITI ================= */
function openSite(t){

    t = t.toLowerCase();

    const sites = [
        ["google","https://google.com","Google"],
        ["youtube","https://youtube.com","YouTube"],
        ["facebook","https://facebook.com","Facebook"],
        ["instagram","https://instagram.com","Instagram"],
        ["github","https://github.com","GitHub"],
        ["canva","https://canva.com","Canva"],
        ["pinterest","https://pinterest.com","Pinterest"],
        ["linkedin","https://linkedin.com","LinkedIn"]
    ];

    for(let s of sites){
        if(t.includes(s[0])){
            window.open(s[1],"_blank");
            return "Apro " + s[2];
        }
    }
    return null;
}

/* ================= METEO (FIX DEFINITIVO) ================= */
function meteo(city){

    return fetch("https://geocoding-api.open-meteo.com/v1/search?name="+city)
    .then(r => r.json())
    .then(geo => {

        if(!geo.results) return "Città non trovata";

        let lat = geo.results[0].latitude;
        let lon = geo.results[0].longitude;

        return fetch(
            "https://api.open-meteo.com/v1/forecast?latitude="+lat+
            "&longitude="+lon+"&current_weather=true"
        )
        .then(r => r.json())
        .then(data => {
            return "🌤️ " + geo.results[0].name + ": " +
            data.current_weather.temperature + "°C";
        });

    })
    .catch(()=> "Errore meteo");
}

/* ================= TIMER ================= */
let timerInterval = null;

function timer(sec){

    sec = parseInt(sec);
    if(isNaN(sec)) return "Scrivi: timer 10";

    let t = sec;

    if(timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(()=>{

        add("⏱️", t + " sec");

        t--;

        if(t < 0){
            clearInterval(timerInterval);
            timerInterval = null;
            add("⏱️","FINITO!");
            speak("Timer terminato");
        }

    },1000);

    return "Timer avviato per " + sec + " secondi";
}

/* ================= SVEGLIA ================= */
function sveglia(time){

    let [h,m] = time.split(":").map(Number);

    let now = new Date();
    let s = new Date();
    s.setHours(h,m,0);

    let diff = s - now;

    if(diff < 0) return "Orario passato";

    setTimeout(()=>{
        add("⏰","SVEGLIA!");
        speak("Sveglia!");
        alert("SVEGLIA!");
    },diff);

    return "Sveglia impostata";
}

/* ================= DOWNLOAD PROGRAMMI ================= */
function scarica(app){

    window.open(
        "https://www.google.com/search?q=download+"+encodeURIComponent(app),
        "_blank"
    );

    return "Cerco download di " + app;
}

/* ================= AI ================= */
async function handle(text){

    text = text.toLowerCase();

    let site = openSite(text);
    if(site) return site;

    if(text.includes("ciao")) return "Ciao!";
    if(text.includes("ora")) return new Date().toLocaleTimeString();
    if(text.includes("data")) return new Date().toLocaleDateString();

    if(text.startsWith("meteo")){
        let city = text.replace("meteo","").trim();
        return await meteo(city);
    }

    if(text.startsWith("timer")){
        return timer(text.replace("timer","").trim());
    }

    if(text.startsWith("sveglia")){
        return sveglia(text.replace("sveglia","").trim());
    }

    if(text.startsWith("scarica")){
        return scarica(text.replace("scarica","").trim());
    }

    if(text.startsWith("cerca")){
        let q = text.replace("cerca","").trim();
        window.open("https://google.com/search?q="+q,"_blank");
        return "Cerco " + q;
    }

    return "Non ho capito";
}

/* ================= INPUT ================= */
async function ask(){

    let i = document.getElementById("input");
    let t = i.value;
    if(!t) return;

    add("🧑",t);

    let r = await handle(t);   // 🔥 IMPORTANTISSIMO FIX

    add("🤖",r);
    speak(r);

    i.value="";
}

/* ================= VOCE ================= */
function voice(){

    let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return alert("Non supportato");

    let r = new SR();
    r.lang = "it-IT";

    r.onresult = async e=>{
        let t = e.results[0][0].transcript;

        add("🧑",t);

        let r2 = await handle(t);   // 🔥 FIX DEFINITIVO

        add("🤖",r2);
        speak(r2);
    };

    r.start();
}

</script>

</body>
</html>
