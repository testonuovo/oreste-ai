<h2>Parla con Oreste AI</h2>

<input id="input" placeholder="Scrivi o usa la voce...">

<br><br>

<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<p id="output"></p>

<script>

/* VOCE */
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);

    document.getElementById("output").innerText = text;
}
function aggiornaWindows(){
    window.open(
        "https://www.microsoft.com/software-download/windows11",
        "_blank"
    );
}
/* ASSISTENTE */
function handle(text){

    if(!text) return;

    text = text.toLowerCase().trim();
    let response = "";

    /* CERCA */
    if(text.startsWith("cerca")){
        let q = text.replace("cerca","").trim();

        window.open(
            "https://www.google.com/search?q=" + encodeURIComponent(q),
            "_blank"
        );

        response = "Cerco " + q;
    }

    /* GOOGLE */
    else if(text.includes("google")){
        window.open("https://www.google.com","_blank");
        response = "Apro Google";
    }

    /* YOUTUBE */
    else if(text.includes("youtube")){
        window.open("https://www.youtube.com","_blank");
        response = "Apro YouTube";
    }

    /* CANVA */
    else if(text.includes("canva")){
        window.open("https://www.canva.com","_blank");
        response = "Apro Canva";
    }

    else if(text.startsWith("meteo")){

    let city = text.replace("meteo","").trim();

    if(city === ""){
        response = "Dimmi la città";
    } else {
        window.location.href =
            "https://www.google.com/search?q=meteo+" +
            encodeURIComponent(city);

        response = "Apro il meteo di " + city;
    }
}

    /* MAPPA */
    else if(text.startsWith("mappa ")){
        let luogo = text.replace("mappa ","");

        window.open(
            "https://www.google.com/maps/search/" + encodeURIComponent(luogo),
            "_blank"
        );

        response = "Apro la mappa di " + luogo;
    }

    /* NOTIZIE */
    else if(text.startsWith("notizie ")){
        let tipo = text.replace("notizie ","");

        window.open(
            "https://news.google.com/search?q=" + encodeURIComponent(tipo),
            "_blank"
        );

        response = "Mostro le notizie su " + tipo;
    }

    /* MUSICA */
    else if(text.startsWith("musica ")){
        let suono = text.replace("musica ","");

        window.open(
            "https://www.youtube.com/results?search_query=" + encodeURIComponent(suono),
            "_blank"
        );

        response = "Cerco musica " + suono;
    }

    /* SCARICA */
    else if(text.startsWith("scarica ")){

        let prog = text.replace("scarica ","");

        if(prog.includes("chrome")){
            window.open("https://www.google.com/chrome/","_blank");
            response = "Apro Chrome";
        }
        else if(prog.includes("firefox")){
            window.open("https://www.mozilla.org/firefox/","_blank");
            response = "Apro Firefox";
        }
        else if(prog.includes("python")){
            window.open("https://www.python.org/downloads/","_blank");
            response = "Apro Python";
        }
        else if(prog.includes("vlc")){
            window.open("https://www.videolan.org/vlc/","_blank");
            response = "Apro VLC";
        }
        else{
            window.open(
                "https://www.google.com/search?q=download+" + encodeURIComponent(prog),
                "_blank"
            );

            response = "Cerco download " + prog;
        }
    }

    /* CALCOLA */
    else if(text.startsWith("calcola ")){
        let exp = text.replace("calcola ","");

        try{
            let result = eval(exp);
            response = "Risultato: " + result;
        }catch{
            response = "Calcolo non valido";
        }
    }

    /* TRADUCI */
    else if(text.startsWith("traduci ")){
        let q = text.replace("traduci ","");

        window.open(
            "https://translate.google.com/?sl=auto&tl=it&text=" +
            encodeURIComponent(q),
            "_blank"
        );

        response = "Apro traduttore";
    }
    else if(text.includes("aggiorna windows")){
    aggiornaWindows();
    response = "scarico aggiornamenti di windows";
}
    /* INFO */
    else if(text.includes("ciao")){
        response = "Ciao! Sono Oreste AI.";
    }
    else if(text.includes("chi sei")){
        response = "Sono il tuo assistente vocale.";
    }
    else if(text.includes("ora")){
        response = "Sono le " + new Date().toLocaleTimeString();
    }
    else if(text.includes("data")){
        response = "Oggi è " + new Date().toLocaleDateString();
    }

    else{
        response = "Non ho capito: " + text;
    }

    speak(response);
}

/* INPUT */
function ask(){
    let text = document.getElementById("input").value;
    handle(text);
}

/* VOCE */
function voice(){

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        speak("Microfono non supportato");
        return;
    }

    let r = new SpeechRecognition();
    r.lang = "it-IT";

    r.onresult = function(e){
        let text = e.results[0][0].transcript;
        document.getElementById("input").value = text;
        handle(text);
    };

    r.start();
}

</script>
