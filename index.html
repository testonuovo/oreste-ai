<script>

/* ================= CHAT ================= */

function add(nome, testo) {

    const chat = document.getElementById("chat");

    const messaggio = document.createElement("div");

    messaggio.className = "msg";

    const nomeElemento = document.createElement("b");

    nomeElemento.textContent = nome + ": ";

    messaggio.appendChild(nomeElemento);

    messaggio.appendChild(
        document.createTextNode(testo)
    );

    chat.appendChild(messaggio);

    chat.scrollTop = chat.scrollHeight;
}


/* ================= VOCE ================= */

function speak(testo) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    const voce = new SpeechSynthesisUtterance(testo);

    voce.lang = "it-IT";

    speechSynthesis.cancel();

    speechSynthesis.speak(voce);
}


/* ================= SITI ================= */

function openSite(testo) {

    const siti = {

        "google": "https://www.google.com/",
        "youtube": "https://www.youtube.com/",
        "facebook": "https://www.facebook.com/",
        "instagram": "https://www.instagram.com/",
        "tiktok": "https://www.tiktok.com/",
        "github": "https://github.com/",
        "canva": "https://www.canva.com/"

    };

    for (const nome in siti) {

        if (testo.includes(nome)) {

            window.open(siti[nome], "_blank");

            return "Apro " + nome;

        }

    }

    return null;
}


/* ================= CANVA ================= */

function canva(testo) {

    const funzioni = {

        "mockup": "https://www.canva.com/mockups/",
        "presentazioni": "https://www.canva.com/presentations/",
        "logo": "https://www.canva.com/create/logos/",
        "volantini": "https://www.canva.com/create/flyers/",
        "video": "https://www.canva.com/create/videos/",
        "poster": "https://www.canva.com/create/posters/",
        "curriculum": "https://www.canva.com/create/resumes/",
        "social": "https://www.canva.com/create/social-media/",
        "biglietti": "https://www.canva.com/create/cards/"

    };

    for (const comando in funzioni) {

        if (testo.includes(comando)) {

            window.open(
                funzioni[comando],
                "_blank"
            );

            return "Apro Canva per " + comando;
        }
    }

    return null;
}


/* ================= METEO ================= */

async function meteo(citta) {

    if (!citta) {
        return "Dimmi quale città vuoi controllare.";
    }

    try {

        const r = await fetch(
            "https://geocoding-api.open-meteo.com/v1/search?name="
            + encodeURIComponent(citta)
            + "&count=1&language=it&format=json"
        );

        const dati = await r.json();

        if (!dati.results || dati.results.length === 0) {
            return "Città non trovata.";
        }

        const lat = dati.results[0].latitude;
        const lon = dati.results[0].longitude;

        const w = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude="
            + lat
            + "&longitude="
            + lon
            + "&current_weather=true"
        );

        const tempo = await w.json();

        return "🌤️ "
            + dati.results[0].name
            + ": "
            + tempo.current_weather.temperature
            + " gradi.";

    }

    catch (errore) {

        console.error(errore);

        return "Errore durante la richiesta del meteo.";

    }
}


/* ================= TIMER ================= */

let timer = null;

function startTimer(secondi) {

    secondi = parseInt(secondi);

    if (isNaN(secondi) || secondi <= 0) {

        return "Scrivi, ad esempio: timer 30";

    }

    if (timer) {
        clearInterval(timer);
    }

    let tempo = secondi;

    add("⏱️", "Timer avviato: " + secondi + " secondi.");

    timer = setInterval(function() {

        if (tempo <= 0) {

            clearInterval(timer);

            timer = null;

            add("⏱️", "FINITO");

            speak("Timer terminato");

            return;
        }

        add("⏱️", tempo + " secondi");

        tempo--;

    }, 1000);

    return "Timer avviato per " + secondi + " secondi.";
}


/* ================= SVEGLIA ================= */

let svegliaTimer = null;

function sveglia(orario) {

    const parti = orario.split(":");

    if (parti.length !== 2) {

        return "Scrivi, ad esempio: sveglia 08:30";

    }

    const h = parseInt(parti[0]);
    const m = parseInt(parti[1]);

    if (
        isNaN(h) ||
        isNaN(m) ||
        h < 0 ||
        h > 23 ||
        m < 0 ||
        m > 59
    ) {

        return "Orario non valido.";

    }

    const adesso = new Date();

    const obiettivo = new Date();

    obiettivo.setHours(h);
    obiettivo.setMinutes(m);
    obiettivo.setSeconds(0);
    obiettivo.setMilliseconds(0);

    if (obiettivo <= adesso) {

        obiettivo.setDate(
            obiettivo.getDate() + 1
        );

    }

    const differenza = obiettivo - adesso;

    if (svegliaTimer) {
        clearTimeout(svegliaTimer);
    }

    svegliaTimer = setTimeout(function() {

        add("⏰", "SVEGLIA!");

        speak("Sveglia!");

        alert("⏰ SVEGLIA!");

    }, differenza);

    return "Sveglia impostata alle " + orario;

}

        "storybook": "storybook.html",

/* ================= CANVA ORESTE AI ================= */

function apriCanva() {

    speak("Impara Canva con Oreste AI");

    setTimeout(function() {

        window.open(
            "guida-canva-oreste-ai.html",
            "_blank"

}


/* ================= CERVELLO ORESTE AI ================= */

async function handle(text) {

    text = text.toLowerCase().trim();

    /* ================= PAGINE ORESTE AI ================= */

    const pagina = apriPagina(text);

    if (pagina) {
        return pagina;
    }

    /* ================= CIAO ================= */

    if (text === "ciao" || text.includes("ciao")) {
        return "Ciao! Sono Oreste AI.";
    }

    /* ================= AIUTO ================= */

    if (
        text.includes("aiuto") ||
        text.includes("cosa sai fare")
    ) {
        return "Sono Oreste AI. Posso aiutarti con meteo, timer, sveglia, ricerca, download, siti, Canva e comandi vocali.";
    }

    /* ================= ORA ================= */

    if (
        text === "ora" ||
        text.includes("che ore sono")
    ) {
        return "Sono le " + new Date().toLocaleTimeString("it-IT");
    }

    /* ================= DATA ================= */

    if (
        text === "data" ||
        text.includes("che giorno è")
    ) {
        return "Oggi è il " + new Date().toLocaleDateString("it-IT");
    }

    /* ================= VICINO CONTURSI ================= */

    if (text.includes("vicino contursi")) {

        window.open(
            "https://youtu.be/r5gGcrJJn_0",
            "_blank"
        );

        return "vicino contursi";
    }

    /* ================= DIFESA PERSONALE ================= */

    if (text.includes("difesa personale")) {

        window.open(
            "https://youtu.be/uUUilRrSrLA",
            "_blank"
        );

        return "difesa personale";
    }

    /* ================= AMNESTY ================= */

    if (text.includes("io sto con amnesty")) {

        window.open(
            "https://iostoconamnesty.altervista.org/",
            "_blank"
        );

        return "io sto con Amnesty";
    }

    if (text.includes("amnesty international")) {

        window.open(
            "https://www.amnesty.it/",
            "_blank"
        );

        return "Amnesty International";
    }

    /* ================= NON TI ARRENDERE ================= */

    if (text.includes("non ti arrendere")) {

        window.open(
            "https://nontiarrendere.altervista.org/",
            "_blank"
        );

        return "Non ti arrendere";
    }

    if(text.includes("karaoke")){

    window.open(
        "https://testonuovo.github.io/karaokeoresteai/",
        "_blank"
    );
    /* ================= METEO ================= */

    if (text.startsWith("meteo")) {

        const citta = text
            .replace("meteo", "")
            .trim();

        return await meteo(citta);
    }

    /* ================= TIMER ================= */

    if (text.startsWith("timer")) {

        return startTimer(
            text.replace("timer", "").trim()
        );
    }

    /* ================= SVEGLIA ================= */

    if (text.startsWith("sveglia")) {

        return sveglia(
            text.replace("sveglia", "").trim()
        );
    }

    /* ================= CERCA / TROVA ================= */

    if (
        text.startsWith("cerca") ||
        text.startsWith("trova")
    ) {

        let ricerca = "";

        if (text.startsWith("cerca")) {
            ricerca = text.replace("cerca", "").trim();
        }

        if (text.startsWith("trova")) {
            ricerca = text.replace("trova", "").trim();
        }

        if (!ricerca) {
            return "Dimmi cosa devo cercare.";
        }

        window.open(
            "https://www.google.com/search?q=" +
            encodeURIComponent(ricerca),
            "_blank"
        );

        return "Cerco " + ricerca;
    }

    /* ================= DOWNLOAD ================= */

    if (text.startsWith("scarica")) {

        return scaricaProgramma(
            text.replace("scarica", "").trim()
        );
    }

    /* ================= CANVA ================= */

    if (
        text.includes("impara canva") ||
        text.includes("canva oreste ai")
    ) {

        window.open(
            "guida-canva-oreste-ai.html",
            "_blank"
        );

        return "Apro la guida Canva di Oreste AI.";
    }

    const comandoCanva = canva(text);

    if (comandoCanva) {
        return comandoCanva;
    }

    /* ================= SITI ================= */

    const sito = openSite(text);

    if (sito) {
        return sito;
    }

    return "Apro il karaoke";
}
    /* ================= RISPOSTA FINALE ================= */

    return "Non ho capito. Scrivi aiuto per vedere i comandi.";
}

/* ================= INVIO ================= */

async function ask() {

    const campo =
        document.getElementById("input");

    const testo =
        campo.value.trim();

    if (!testo) {
        return;
    }

    add("🧑", testo);

    campo.value = "";

    const risposta =
        await handle(testo);

    add("🤖", risposta);

    if (risposta) {
        speak(risposta);
    }

}


/* ================= RICONOSCIMENTO VOCALE ================= */

function voice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Il riconoscimento vocale funziona meglio con Google Chrome."
        );

        return;

    }

    const ascolto =
        new SpeechRecognition();

    ascolto.lang = "it-IT";

    ascolto.continuous = false;

    ascolto.interimResults = false;


    ascolto.onstart = function() {

        add(
            "🎤",
            "Ascolto attivo..."
        );

    };


    ascolto.onresult =
        async function(event) {

            const testo =
                event.results[0][0].transcript;

            add("🧑", testo);

            const risposta =
                await handle(testo);

            add("🤖", risposta);

            if (risposta) {

                speak(risposta);

            }

        };


    ascolto.onerror =
        function(event) {

            console.error(event);

            add(
                "🎤",
                "Errore nel riconoscimento vocale."
            );

        };


    ascolto.start();

}
