<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Oreste AI - Assistente Vocale</title>

<style>
body{
    font-family: Arial;
    background:#0a3d91;
    color:white;
    text-align:center;
    margin:0;
}

h1{ margin-top:20px; }

#chat{
    width:90%;
    max-width:600px;
    margin:20px auto;
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:10px;
    min-height:300px;
    text-align:left;
}

input{
    width:70%;
    padding:10px;
    border-radius:10px;
    border:none;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    cursor:pointer;
}

button:hover{
    background:darkred;
}

.msg{
    margin:8px 0;
    padding:8px;
}
</style>
</head>

<body>

<h1>🎤 Oreste AI</h1>

<input id="input" placeholder="Scrivi o parla...">
<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<div id="chat"></div>

<script>

function add(type, text){
    document.getElementById("chat").innerHTML += "<div class='msg'>"+type+": "+text+"</div>";
}

function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
}

function handle(text){

    text = text.toLowerCase();

    if(text.includes("ciao")) return "Ciao! Sono Oreste AI";
    if(text.includes("ora")) return new Date().toLocaleTimeString();
    if(text.includes("data")) return new Date().toLocaleDateString();

    if(text.includes("google")){
        window.open("https://www.google.com","_blank");
        return "Apro Google";
    }

    if(text.includes("youtube")){
        window.open("https://www.youtube.com","_blank");
        return "Apro YouTube";
    }

    if(text.includes("canva")){
        window.open("https://www.canva.com","_blank");
        return "Apro Canva";
    }

    if(text.includes("facebook")){
        window.open("https://www.facebook.com","_blank");
        return "Apro Facebook";
    }

    if(text.includes("instagram")){
        window.open("https://www.instagram.com","_blank");
        return "Apro Instagram";
    }

    if(text.startsWith("cerca")){
        let q = text.replace("cerca","").trim();
        window.open("https://www.google.com/search?q="+encodeURIComponent(q));
        return "Cerco " + q;
    }

    return "Non ho capito il comando";
}

function ask(){
    let input = document.getElementById("input");
    let text = input.value.trim();
    if(!text) return;

    add("🧑", text);

    let res = handle(text);

    add("🤖", res);

    speak(res);

    input.value = "";
}

function voice(){

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SR){
        alert("Voce non supportata nel browser");
        return;
    }

    let r = new SR();
    r.lang = "it-IT";
    r.continuous = false;
    r.interimResults = false;

    add("🤖", "🎤 Ti ascolto...");

    r.onresult = function(e){

        let text = e.results[0][0].transcript;

        add("🧑", text);

        let res = handle(text);

        add("🤖", res);

        speak(res);
    };

    r.onerror = function(e){
        add("🤖", "Errore voce: " + e.error);
    };

    r.start();
}

</script>

</body>
</html>
