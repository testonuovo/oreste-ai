<style>
body{
    background: blue;

    text-align: center;

<body>

<h1>🎤 Assistente vocale Oreste AI</h1>

<nav>
<a href="index.html">Home</a>
<a href="assistente.html">Assistente</a>
<a href="download.html">Download</a>

<div class="card">

<h2>Parla con Oreste AI</h2>

<input id="input" placeholder="Scrivi o usa la voce...">

<br><br>

<button onclick="run()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<p id="output"></p>

</div>

<script>

// 🔊 VOCE
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
}

// ⌨️ INPUT TESTO
function run(){
    handle(document.getElementById("input").value);
}

// 🎤 VOCE
function voice(){

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        speak("Microfono non supportato");
        return;
    }

    try{
        const recognition = new SpeechRecognition();
        recognition.lang = "it-IT";

        recognition.start();

        recognition.onresult = function(event){
            let text = event.results[0][0].transcript;
            document.getElementById("input").value = text;
            handle(text);
        };

        recognition.onerror = function(){
            speak("Errore microfono");
        };

    }catch(err){
        speak("Errore riconoscimento vocale");
    }
}

// 🧠 COMANDI
function handle(text){

    text = (text || "").toLowerCase().trim();

    // 🌐 GOOGLE
    if(text.includes("google")){
        window.open("https://www.google.com","_blank");
        speak("Apro Google");
        return;
    }

    // 🔎 CERCA
    if(text.startsWith("cerca ")){
        let q = text.replace("cerca ","");
        window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank");
        speak("Cerco " + q);
        return;
    }

    // ▶️ YOUTUBE
    if(text.includes("youtube")){
        window.open("https://www.youtube.com","_blank");
        speak("Apro YouTube");
        return;
    }

    // 📘 FACEBOOK
    if(text.includes("facebook")){
        window.open("https://www.facebook.com","_blank");
        speak("Apro Facebook");
        return;
    }

    // 🕒 ORA
    if(text.includes("che ore")){
        let t = new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
        speak("Sono le " + t);
        return;
    }

    // ❌ DEFAULT
    speak("Non ho capito il comando");
}

</script>
