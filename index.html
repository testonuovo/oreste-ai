    background: rgba(255,255,255,0.1);
    padding:10px;
    border-radius:8px;
    cursor:pointer;

<h2>Assistente vocale</h2>

<input id="input" placeholder="Scrivi o parla...">
<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<div id="chat"></div>

<h2>📅 Calendario Mensile</h2>

<div>
<button onclick="prevMonth()">⬅️</button>
<span id="monthTitle"></span>
<button onclick="nextMonth()">➡️</button>
</div>

<div id="calendar"></div>
<a href="https://www.facebook.com/" target="_blank">
📘 Seguici su Facebook
</a>
<script>

/* ================= CHAT ================= */
function add(t,m){
    document.getElementById("chat").innerHTML +=
    "<div class='msg'>"+t+": "+m+"</div>";
}

function speak(t){
    let s=new SpeechSynthesisUtterance(t);
    s.lang="it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(s);
}

/* ================= SITI ================= */
function openSite(text){

    text = text.toLowerCase();

    const sites = [
        {k:["google"], url:"https://google.com", name:"Google"},
        {k:["youtube"], url:"https://youtube.com", name:"YouTube"},
        {k:["facebook"], url:"https://facebook.com", name:"Facebook"},
        {k:["instagram"], url:"https://instagram.com", name:"Instagram"},
        {k:["tiktok"], url:"https://tiktok.com", name:"TikTok"},
        {k:["canva"], url:"https://canva.com", name:"Canva"},
        {k:["whatsapp"], url:"https://web.whatsapp.com", name:"WhatsApp"},
        {k:["github"], url:"https://github.com", name:"GitHub"},
        {k:["pinterest"], url:"https://pinterest.com", name:"Pinterest"},
        {k:["linkedin"], url:"https://linkedin.com", name:"LinkedIn"}
    ];

    for(let s of sites){
        for(let x of s.k){
            if(text.includes(x)){
                window.open(s.url,"_blank");
                return "Apro " + s.name;
            }
        }
    }

    return null;
}

/* ================= CALENDARIO ================= */
let date = new Date();
const mesi = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];

function renderCalendar(){
    let cal = document.getElementById("calendar");
    cal.innerHTML = "";

    let y = date.getFullYear();
    let m = date.getMonth();

    document.getElementById("monthTitle").innerText = mesi[m] + " " + y;

    let first = new Date(y,m,1).getDay();
    let days = new Date(y,m+1,0).getDate();

    for(let i=0;i<first;i++){
        let e=document.createElement("div");
        e.className="day empty";
        cal.appendChild(e);
    }

    for(let d=1; d<=days; d++){
        let div=document.createElement("div");
        div.className="day";
        div.innerHTML=d;

        div.onclick=()=>{
            let ev = prompt("Evento:");
            if(ev){
                localStorage.setItem("ev_"+y+"_"+m+"_"+d, ev);
            }
        };

        cal.appendChild(div);
    }
}

function nextMonth(){
    date.setMonth(date.getMonth()+1);
    renderCalendar();
}

function prevMonth(){
    date.setMonth(date.getMonth()-1);
    renderCalendar();
}

/* ================= AI ================= */
function handle(text){

    text = text.toLowerCase();

    // 🔥 SITI
    let site = openSite(text);
    if(site) return site;

    if(text.includes("ciao")) return "Ciao!";
    if(text.includes("ora")) return new Date().toLocaleTimeString();
    if(text.includes("data")) return new Date().toLocaleDateString();

    if(text.startsWith("cerca")){
        let q = text.replace("cerca","").trim();
        window.open("https://google.com/search?q="+q,"_blank");
        return "Cerco " + q;
    }

    if(text.startsWith("scarica")){
        let q = text.replace("scarica","").trim();
        window.open("https://google.com/search?q=download+"+q,"_blank");
        return "Cerco download di " + q;
    }

    return "Non ho capito";
}

/* ================= INPUT ================= */
function ask(){
    let i=document.getElementById("input");
    let t=i.value;
    if(!t) return;

    add("🧑",t);
    let r=handle(t);
    add("🤖",r);
    speak(r);
    i.value="";
}

/* ================= VOCE ================= */
function voice(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return alert("Non supportato");

    let r=new SR();
    r.lang="it-IT";

    r.onresult=e=>{
        let t=e.results[0][0].transcript;
        add("🧑",t);
        let r2=handle(t);
        add("🤖",r2);
        speak(r2);
    };

    r.start();
}

/* INIT */
renderCalendar();

</script>
