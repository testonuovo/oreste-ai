<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oreste AI - Assistente Vocale Italiano</title>

<meta name="description" content="Oreste AI è un assistente vocale italiano per controllare il web con la voce.">

<style>
body{
background:blue;
font-family:Arial;
text-align:center;
color:white;
}

button{
background:red;
color:white;
border-radius:19px;
padding:10px;
border:none;
margin:5px;
cursor:pointer;
}

a{
text-decoration:none;
color:red;
margin:10px;
display:inline-block;
}

.card{
margin-top:20px;
}
</style>

</head>

<body>

<h1>🎤 Assistente vocale Oreste AI</h1>

<nav>
<a href="index.html">Home</a>
<a href="assistente.html">Assistente</a>
<a href="download.html">Download</a>
<a href="blog.html">Blog</a>
</nav>

<div class="card">

<input id="input" placeholder="Scrivi o usa la voce...">

<br>

<button onclick="run()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<p id="output"></p>

</div>

<script>

function speak(text){
let msg = new SpeechSynthesisUtterance(text);
msg.lang = "it-IT";
speechSynthesis.cancel();
speechSynthesis.speak(msg);
}

function run(){
handle(document.getElementById("input").value);
}

function voice(){

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
speak("Microfono non supportato");
return;
}

try{
const recognition = new SpeechRecognition();
recognition.lang = "it-IT";

recognition.start();

recognition.onresult = function(e){
let text = e.results[0][0].transcript;
document.getElementById("input").value = text;
handle(text);
};

}catch(err){
speak("Errore microfono");
}

}

function handle(text){

text = (text || "").toLowerCase();

if(text.includes("google")){
window.open("https://google.com","_blank");
speak("Apro Google");
return;
}

if(text.startsWith("cerca ")){
let q = text.replace("cerca ","");
window.open("https://google.com/search?q="+q,"_blank");
speak("Cerco " + q);
return;
}

if(text.startsWith("apri youtube")){
window.open("https://youtube.com","_blank");
speak("Apro YouTube");
return;
}

if(text.startsWith("apri facebook")){
window.open("https://facebook.com","_blank");
speak("Apro Facebook");
return;
}

if(text.includes("che ore")){
let t = new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
speak("Sono le " + t);
return;
}

speak("Non ho capito il comando");
}

</script>

</body>
</html>
