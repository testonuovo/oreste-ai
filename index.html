<div class="card">

<h2>Parla con Oreste AI</h2>

<input id="input" placeholder="Scrivi o usa la voce...">

<br><br>

<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<p id="output"></p>

</div>

<a href="https://oresteai.altervista.org/">👉 Blog ufficiale</a>

<script>

/* 🔊 VOCE */
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);

    document.getElementById("output").innerText = text;
}

/* 🌐 FUNZIONE APERTURA SITI (UNICA E STABILE) */
function openSite(url, msg){
    window.open(url, "_blank", "noopener,noreferrer");
    return msg;
}

/* 🧠 ASSISTENTE CENTRALE */
function handle(text){
    if(!text) return;

    text = text.toLowerCase().trim();

    let response = "";

    // CERCA
    if(text.startsWith("cerca")){
        let q = text.replace("cerca", "").trim();

        if(q.length === 0){
            response = "Dimmi cosa devo cercare";
        } else {
            window.open(
                "https://www.google.com/search?q=" + encodeURIComponent(q),
                "_blank",
                "noopener,noreferrer"
            );
            response = "Cerco " + q;
        }
    }

    // SITI
    else if(text.includes("google")){
        response = openSite("https://www.google.com", "Apro Google.");
    }

    else if(text.includes("youtube")){
        response = openSite("https://www.youtube.com", "Apro YouTube.");
    }

    else if(text.includes("canva")){
        response = openSite("https://www.canva.com", "Apro Canva.");
    }

    // INFO
    else if(text.includes("ciao")){
        response = "Ciao! Sono Oreste AI.";
    }

    else if(text.includes("chi sei")){
        response = "Sono il tuo assistente vocale italiano online.";
    }

    else if(text.includes("ora")){
        response = "Sono le " + new Date().toLocaleTimeString();
    }

    else if(text.includes("data")){
        response = "Oggi è " + new Date().toLocaleDateString();
    }

    else{
        response = "Non ho capito: " + text;
    }

    speak(response);
}

/* ⌨️ INPUT */
function ask(){
    let text = document.getElementById("input").value;
    handle(text);
}

/* 🎤 VOCE */
function voice(){

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        speak("Microfono non supportato");
        return;
    }

    let r = new SpeechRecognition();
    r.lang = "it-IT";

    r.onresult = function(e){
        let text = e.results[0][0].transcript;
        document.getElementById("input").value = text;
        handle(text);
    };

    r.onerror = function(){
        speak("Errore microfono");
    };

    r.start();
}

</script>
