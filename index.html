<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Oreste AI - Assistente Vocale Italiano Gratis Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Oreste AI è un assistente vocale italiano gratuito online.">
<meta name="author" content="Oreste De Chiara">
<meta name="robots" content="index, follow">

<style>
body{
    background: blue;
    font-family: Arial;
    text-align: center;
    color: white;
    margin: 0;
}

h1{ margin-top: 20px; }

nav a{
    text-decoration: none;
    color: red;
    margin: 8px;
    display: inline-block;
    font-weight: bold;
}

#chat{
    width: 85%;
    max-width: 700px;
    margin: 20px auto;
    padding: 10px;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    min-height: 300px;
    text-align: left;
}

.msg{
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}

.user{ background:#ff4444; }
.ai{ background:#00aa88; }

input{
    width: 80%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

button{
    background: red;
    color: white;
    border-radius: 12px;
    padding: 10px 15px;
    border: none;
    margin: 5px;
    cursor: pointer;
}

button:hover{
    background: darkred;
}
</style>
</head>

<body>

<h1>🎤 Oreste AI</h1>

<!-- MENU COMPLETO -->
<nav>
<a href="index.html">Home</a>
<a href="assistente.html">Assistente</a>
<a href="chat.html">Chat</a>
<a href="download.html">Download</a>
<a href="blog.html">Blog</a>
<a href="chi-siamo.html">Chi siamo</a>
<a href="contatti.html">Contatti</a>
<a href="dashboard.html">Dashboard</a>
<a href="os.html">Oreste OS</a>
</nav>

<input id="input" placeholder="Scrivi o usa la voce...">

<br><br>

<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<div id="chat"></div>

<script>

/* ================= CHAT ================= */
function addMessage(type, text){
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "msg " + (type === "user" ? "user" : "ai");

    div.textContent = (type === "user" ? "🧑 Tu: " : "🤖 Oreste AI: ") + text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* ================= VOCE ================= */
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
}

/* ================= RICERCA ================= */
function searchGoogle(query){
    if(!query) return;

    window.open(
        "https://www.google.com/search?q=" + encodeURIComponent(query),
        "_blank"
    );

    return "Cerco: " + query;
}

/* ================= LOGICA PRINCIPALE ================= */
function handle(text){

    text = text.toLowerCase().trim();

    if(text.includes("ciao")) return "Ciao! Sono Oreste AI 👋";
    if(text.includes("chi sei")) return "Sono il tuo assistente vocale.";
    if(text.includes("ora")) return "Sono le " + new Date().toLocaleTimeString();
    if(text.includes("data")) return "Oggi è " + new Date().toLocaleDateString();

    /* 🔎 CERCA */
    if(text.startsWith("cerca")){
        let query = text.replace("cerca","").trim();
        return searchGoogle(query);
    }

    /* 🌐 APERTURE SITI */
    if(text.includes("google")){
        window.open("https://www.google.com", "_blank");
        return "Apro Google";
    }

    if(text.includes("youtube")){
        window.open("https://www.youtube.com", "_blank");
        return "Apro YouTube";
    }

    if(text.includes("canva")){
        window.open("https://www.canva.com", "_blank");
        return "Apro Canva";
    }

    if(text.includes("linkedin")){
        window.open("https://www.linkedin.com", "_blank");
        return "Apro LinkedIn";
    }

    if(text.includes("facebook")){
        window.open("https://www.facebook.com", "_blank");
        return "Apro Facebook";
    }

    if(text.includes("instagram")){
        window.open("https://www.instagram.com", "_blank");
        return "Apro Instagram";
    }

    /* 📚 WIKI */
    if(text.startsWith("wiki")){
        let q = text.replace("wiki","").trim();
        window.open("https://it.wikipedia.org/wiki/" + encodeURIComponent(q), "_blank");
        return "Cerco su Wikipedia: " + q;
    }

    /* 🌦 METEO */
    if(text.startsWith("meteo")){
        let citta = text.replace("meteo","").trim();
        window.open("https://www.google.com/search?q=meteo+" + encodeURIComponent(citta), "_blank");
        return "Cerco il meteo di " + citta;
    }

    /* 🌐 APRI SITO */
    if(text.startsWith("apri ")){
        let sito = text.replace("apri ","").trim();
        if(!sito.startsWith("http")) sito = "https://" + sito;
        window.open(sito, "_blank");
        return "Apro " + sito;
    }

    /* 🔗 VAI SU */
    if(text.startsWith("vai su")){
        let sito = text.replace("vai su","").trim();
        if(!sito.startsWith("http")) sito = "https://" + sito;
        window.open(sito, "_blank");
        return "Ti porto su " + sito;
    }

    /* 📥 DOWNLOAD PROGRAMMI */
    if(text.startsWith("scarica")){
        let app = text.replace("scarica","").trim().toLowerCase();

        const download = {
            "chrome": "https://www.google.com/chrome/",
            "firefox": "https://www.mozilla.org/firefox/",
            "edge": "https://www.microsoft.com/edge",
            "vscode": "https://code.visualstudio.com/",
            "blender": "https://www.blender.org/download/",
            "discord": "https://discord.com/download",
            "spotify": "https://www.spotify.com/download",
            "telegram": "https://telegram.org/apps",
            "whatsapp": "https://www.whatsapp.com/download"
        };

        if(download[app]){
            window.open(download[app], "_blank");
            return "Scarico: " + app;
        }

        let query = app + " download ufficiale";
        window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank");

        return "Non trovato, cerco su internet: " + app;
    }

    return "Non ho capito il comando";
}

/* ================= INVIO ================= */
function ask(){
    let input = document.getElementById("input");
    let text = input.value;
    if(!text) return;

    addMessage("user", text);

    let response = handle(text);

    addMessage("ai", response);
    speak(response);

    input.value = "";
}

/* ================= VOCE ================= */
function voice(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("Microfono non supportato");
        return;
    }

    let r = new SpeechRecognition();
    r.lang = "it-IT";

    r.onresult = function(e){
        let text = e.results[0][0].transcript;
        document.getElementById("input").value = text;
        ask();
    };

    r.start();
}

/* ================= START ================= */
window.onload = function(){
    addMessage("ai", "Ciao! Sono Oreste AI 👋");
};

</script>

</body>
</html>
