<body>

<header>

<main>

<div class="card">

<img src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png"
alt="Oreste AI assistente vocale"
class="avatar">

<h2>Parla con Oreste AI</h2>

<input id="input" placeholder="Scrivi o usa la voce...">

<br><br>

<button onclick="run()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<p id="output"></p>

</div>

</main>

<script>

/* ======================
   VOCE
====================== */
function speak(text){

const msg = new SpeechSynthesisUtterance(text);
msg.lang = "it-IT";
speechSynthesis.cancel();
speechSynthesis.speak(msg);

}

/* ======================
   INPUT
====================== */
function run(){
handle(document.getElementById("input").value);
}

/* ======================
   VOCE INPUT
====================== */
function voice(){

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
speak("Voce non supportata");
return;
}

const recognition = new SpeechRecognition();
recognition.lang = "it-IT";

recognition.start();

recognition.onresult = function(event){
const text = event.results[0][0].transcript;
document.getElementById("input").value = text;
handle(text);
};

}

/* ======================
   COMANDI ASSISTENTE
====================== */
function handle(text){

text = (text || "").toLowerCase().trim();

/* ---- GOOGLE ---- */
if(text.includes("google")){
window.open("https://www.google.com", "_blank");
speak("Apro Google");
return;
}

/* ---- CERCA ---- */
if(text.startsWith("cerca ")){
let q = text.replace("cerca ","");
window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank");
speak("Cerco " + q);
return;
}

/* ---- APRI SITI ---- */
if(text.startsWith("apri ")){

let sito = text.replace("apri ","");

let url = "";

if(sito.includes("youtube")){
url = "https://www.youtube.com";
}
else if(sito.includes("instagram")){
url = "https://www.instagram.com";
}
else if(sito.includes("facebook")){
url = "https://www.facebook.com";
}
else {
url = "https://www.google.com/search?q=" + encodeURIComponent(sito);
}

window.open(url, "_blank");
speak("Apro " + sito);
return;
}

/* ---- SEARCH INGLESE ---- */
if(text.startsWith("search ")){
let q = text.replace("search ","");
window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank");
speak("Searching " + q);
return;
}

speak("Non ho capito il comando");

}

</script>
