<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Meditazione - Oreste AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:blue;
    color:white;
    text-align:center;
    overflow:hidden;
}

.container{
    margin-top:60px;
    padding:20px;
}

.card{
    background:rgba(0,0,0,0.3);
    padding:20px;
    border-radius:15px;
    max-width:600px;
    margin:auto;
}

button{
    padding:12px 18px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:green;
    color:white;
    cursor:pointer;
}

button:hover{
    background:darkgreen;
}

/* 🌊 animazione respiro */
.circle{
    width:120px;
    height:120px;
    margin:30px auto;
    border-radius:50%;
    background:blue;
    animation:breathe 6s infinite;
}

@keyframes breathe{
    0%{transform:scale(1);}
    50%{transform:scale(1.5);}
    100%{transform:scale(1);}
}
</style>
</head>

<body>

<h1>🧘 Meditazione - Oreste AI</h1>

<div class="container">

<div class="card">

    <p id="text">Premi "Avvia meditazione"</p>

    <div class="circle"></div>

    <button onclick="startMeditation()">🎧 Avvia meditazione</button>
    <button onclick="stopMeditation()">⛔ Stop meditazione</button>

    <audio id="music" loop>
        <source src="mare.mp3" type="audio/mpeg">
    </audio>

</div>

</div>

<script>

/* 🌱 frasi meditazione */
const frasi = [
"Respira profondamente...",
"Lascia andare la tensione...",
"Sei al sicuro...",
"Resta nel presente...",
"La mente si calma...",
"Rilassati..."
];

let meditationInterval = null;
let index = 0;

/* ▶️ AVVIA */
function startMeditation(){

    stopMeditation(); // sicurezza

    const music = document.getElementById("music");
    music.volume = 0.4;

    music.play().catch(()=>{});

    index = 0;

    meditationInterval = setInterval(() => {

        document.getElementById("text").innerText = frasi[index];
        index++;

        if(index >= frasi.length){
            index = 0;
        }

    }, 4000);

    // voce iniziale
    let msg = new SpeechSynthesisUtterance("Inizia la meditazione. Respira lentamente.");
    msg.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
}

/* ⛔ STOP */
function stopMeditation(){

    // ferma timer
    clearInterval(meditationInterval);
    meditationInterval = null;

    // ferma musica
    const music = document.getElementById("music");
    music.pause();
    music.currentTime = 0;

    // ferma voce
    speechSynthesis.cancel();

    document.getElementById("text").innerText = "Meditazione fermata ⛔";
}

</script>

</body>
</html>
