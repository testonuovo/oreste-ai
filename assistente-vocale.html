<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Assistente Vocale Oreste AI</title>

<style>
body{
    font-family: Arial;
    background: #0a3d91;
    color: white;
    text-align: center;
    margin: 0;
}

h1{
    margin-top: 20px;
}

#chat{
    width: 90%;
    max-width: 600px;
    margin: auto;
    margin-top: 20px;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 10px;
    min-height: 300px;
    text-align: left;
    overflow-y: auto;
}

.msg{
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}

.user{ background: #ff4444; }
.ai{ background: #00aa88; }

input{
    width: 80%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    margin-top: 10px;
    font-size: 16px;
}

button{
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    background: red;
    color: white;
    cursor: pointer;
    margin-top: 10px;
    margin-left: 5px;
}

button:hover{
    background: darkred;
}
</style>
</head>

<body>

<h1>🎤 Assistente Vocale Oreste AI</h1>

<input id="input" placeholder="Scrivi o parla..." />

<br>

<button onclick="ask()">Invia</button>
<button onclick="voice()">Parla 🎤</button>

<div id="chat"></div>
<nav>
<a href="index.html">🏠 Home</a>
<a href="assistente-vocale.html">🎤 Assistente</a>
<a href="chat.html">💬 Chat</a>
<a href="motivazione.html">🌻 Motivazione</a>
<a href="download.html">📥 Download</a>
<a href="blog.html">📰 Blog</a>
<a href="chi-siamo.html">👤 Chi siamo</a>
<a href="contatti.html">📞 Contatti</a>
<a href="dashboard.html">📊 Dashboard</a>
<a href="os.html">🖥️ Oreste OS</a>
</nav>
<script>

/* CHAT */
function addMsg(type, text){
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;

    chat.appendChild(div);

    // scroll automatico
    chat.scrollTop = chat.scrollHeight;
}

/* VOCE OUTPUT */
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
}

/* LOGICA AI */
function handle(text){

    text = text.toLowerCase().trim();

    // 🌐 GOOGLE
    if(text.includes("google")){
        window.open("https://www.google.com","_blank");
        return "Apro Google";
    }

    // ▶️ YOUTUBE
    if(text.includes("youtube")){
        window.open("https://www.youtube.com","_blank");
        return "Apro YouTube";
    }

    // 🎨 CANVA
    if(text.includes("canva")){
        window.open("https://www.canva.com","_blank");
        return "Apro Canva";
    }

    // 💼 LINKEDIN
    if(text.includes("linkedin")){
        window.open("https://www.linkedin.com","_blank");
        return "Apro LinkedIn";
    }

    // 🌐 APRI GENERICO
    if(text.startsWith("apri ")){
        let sito = text.replace("apri ","").trim();

        if(!sito.startsWith("http")){
            sito = "https://" + sito;
        }

        window.open(sito, "_blank");
        return "Apro " + sito;
    }

    // 🎤 CIAO
    if(text.includes("ciao")){
        return "Ciao! Sono Oreste AI 👋";
    }

    // 🕒 ORA
    if(text.includes("che ora è") || text.includes("ora")){
        return "Sono le " + new Date().toLocaleTimeString();
    }

    // 🔎 CERCA
    if(text.startsWith("cerca")){
        let q = text.replace("cerca","").trim();
        window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank");
        return "Cerco " + q;
    }

    return "Non ho capito il comando: " + text;
}

/* INVIA TESTO */
function ask(){
    let input = document.getElementById("input");
    let text = input.value.trim();

    if(!text) return;

    addMsg("user","🧑 " + text);

    let response = handle(text);

    addMsg("ai","🤖 " + response);

    speak(response);

    input.value = "";
}

/* VOCE */
function voice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("Voce non supportata");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "it-IT";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    addMsg("ai","🎤 Parla adesso...");

    recognition.onresult = function(event){

        const text = event.results[0][0].transcript;

        addMsg("user","🧑 " + text);

        const response = handle(text);

        addMsg("ai","🤖 " + response);

        speak(response);
    };

    recognition.onerror = function(event){
        addMsg("ai","⚠️ Errore: " + event.error);
    };

    recognition.start();
}

</script>

</body>
</html>
