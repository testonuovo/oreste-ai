<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Assistente Vocale Oreste AI</title>

<style>
body{
    font-family: Arial;
    background: #0a3d91;
    color: white;
    text-align: center;
    margin: 0;
}

h1{ margin-top: 20px; }

#chat{
    width: 90%;
    max-width: 600px;
    margin: auto;
    margin-top: 20px;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 10px;
    min-height: 300px;
    text-align: left;
}

.msg{
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}

.user{ background: #ff4444; }
.ai{ background: #00aa88; }

input{
    width: 70%;
    padding: 10px;
    border-radius: 10px;
    border: none;
}

button{
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    background: red;
    color: white;
    cursor: pointer;
    margin: 5px;
}

button:hover{
    background: darkred;
}
</style>
</head>

<body>

<h1>🎤 Assistente Vocale Oreste AI</h1>

<input id="input" placeholder="Scrivi un comando...">

<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<div id="chat"></div>

<script>

/* CHAT */
function addMsg(type, text){
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* VOCE OUTPUT */
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "it-IT";
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
}

/* LOGICA COMANDI */
function handle(text){

    text = text.toLowerCase().trim();

    if(text.includes("ciao")) return "Ciao! Sono Oreste AI 👋";

    if(text.includes("ora"))
        return "Sono le " + new Date().toLocaleTimeString();

    if(text.includes("data"))
        return "Oggi è " + new Date().toLocaleDateString();

    if(text.includes("google")){
        window.open("https://www.google.com", "_blank");
        return "Apro Google";
    }

    if(text.includes("youtube")){
        window.open("https://www.youtube.com", "_blank");
        return "Apro YouTube";
    }

    if(text.includes("canva")){
        window.open("https://www.canva.com", "_blank");
        return "Apro Canva";
    }

    if(text.includes("facebook")){
        window.open("https://www.facebook.com", "_blank");
        return "Apro Facebook";
    }

    if(text.includes("instagram")){
        window.open("https://www.instagram.com", "_blank");
        return "Apro Instagram";
    }

    if(text.startsWith("cerca")){
        let q = text.replace("cerca","").trim();
        window.open("https://www.google.com/search?q=" + encodeURIComponent(q));
        return "Cerco " + q;
    }

    return "Non ho capito il comando: " + text;
}

/* INPUT TESTO */
function ask(){
    let input = document.getElementById("input");
    let text = input.value;

    if(!text) return;

    addMsg("user", "🧑 " + text);

    let response = handle(text);

    addMsg("ai", "🤖 " + response);

    speak(response);

    input.value = "";
}

/* VOCE */
function voice(){

    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("Il browser non supporta la voce");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "it-IT";
    recognition.continuous = false;
    recognition.interimResults = false;

    addMsg("ai", "🎤 Ti ascolto...");

    recognition.onresult = function(event){

        const text = event.results[0][0].transcript;

        addMsg("user", "🧑 " + text);

        const response = handle(text);

        addMsg("ai", "🤖 " + response);

        speak(response);
    };

    recognition.onerror = function(e){
        addMsg("ai", "⚠️ Errore: " + e.error);
    };

    recognition.start();
}

/* AVVIO */
window.onload = function(){
    addMsg("ai", "Ciao! Sono Oreste AI 👋");
};

</script>

</body>
</html>
